<!DOCTYPE html>
<html>
  <head>
    <title>Simple Map</title>
    <meta name="viewport" content="initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="stylesheet" href="basicmap.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBe0hJfFtyjqW678Mmmdkz8EFH2JoNlFbE&callback=initMap&loading=async" async defer></script>
	<script asyncsrc src="basicmap.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      var map;
      function initMap() {
        map = new google.maps.Map(document.getElementById('map'), {
          center: {lat: -34.397, lng: 150.644},
          zoom: 8
        });
      }
    
  </body>
</html>
